<script>
  /* =====================================================================
     PAINEL DE DIAGNÓSTICO
     ---------------------------------------------------------------------
     Se algo falhar (CDN bloqueado, config errada, etc.), isso evita uma
     tela em branco silenciosa e mostra o motivo na própria página.
     ===================================================================== */
  function showFatalError(title, detail) {
    var root = document.getElementById("root");
    if (!root || root.dataset.appMounted === "1") return;
    root.innerHTML =
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;' +
      'background:#101820;color:#EDE8DD;font-family:IBM Plex Sans, sans-serif;padding:20px;">' +
      '<div style="max-width:640px;background:#17222C;border:1px solid #2B3A47;border-radius:14px;padding:26px;">' +
      '<div style="font-family:Fraunces, serif;font-style:italic;font-size:20px;color:#D6A94A;margin-bottom:10px;">' + title + '</div>' +
      '<div style="font-family:IBM Plex Mono, monospace;font-size:12.5px;color:#8FA0AC;white-space:pre-wrap;line-height:1.6;">' +
      (detail || "").replace(/</g, "&lt;") + '</div></div></div>';
  }

  window.addEventListener("error", function (e) {
    console.error("Erro capturado:", e.error || e.message);
    showFatalError("Ocorreu um erro ao carregar o app", (e.message || "") + (e.filename ? ("\n" + e.filename + ":" + e.lineno) : ""));
  });
  window.addEventListener("unhandledrejection", function (e) {
    console.error("Promise rejeitada:", e.reason);
    showFatalError("Ocorreu um erro ao carregar o app", String(e.reason && e.reason.message || e.reason));
  });

  // Se depois de alguns segundos nada foi renderizado, diagnostica quais
  // bibliotecas externas (CDN) não carregaram.
  window.addEventListener("load", function () {
    setTimeout(function () {
      var root = document.getElementById("root");
      if (root && root.innerHTML.trim() === "") {
        var missing = [];
        if (typeof React === "undefined") missing.push("React (unpkg.com/react)");
        if (typeof ReactDOM === "undefined") missing.push("ReactDOM (unpkg.com/react-dom)");
        if (typeof Babel === "undefined") missing.push("Babel (unpkg.com/@babel/standalone)");
        if (typeof firebase === "undefined") missing.push("Firebase (gstatic.com/firebasejs)");
        showFatalError(
          "A página ficou em branco",
          missing.length
            ? "Estas bibliotecas externas não carregaram (provável bloqueio de rede/adblock/firewall):\n- " + missing.join("\n- ") +
              "\n\nAbra o Console do navegador (F12) para mais detalhes."
            : "Todas as bibliotecas externas carregaram, mas o app não renderizou. Abra o Console do navegador (F12) e veja a mensagem de erro em vermelho."
        );
      }
    }, 3500);
  });
</script>

<script>
  /* =====================================================================
     CONFIGURAÇÃO DO FIREBASE
     ---------------------------------------------------------------------
     1. Crie um projeto gratuito em https://console.firebase.google.com
        (plano "Spark", sem custo).
     2. Ative "Authentication" > método "Anônimo".
     3. Ative "Firestore Database" (modo produção) e configure as regras
        (veja o texto que acompanha este arquivo).
     4. Em "Configurações do projeto" > "Seus apps" > "Web", copie o
        objeto de configuração e cole abaixo, substituindo os valores.
     5. Em Authentication > Settings > Authorized domains, adicione o
        domínio do GitHub Pages (ex: seuusuario.github.io) — sem isso o
        login anônimo falha.
     ===================================================================== */
  window.__FIREBASE_CONFIG__ = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  window.__FIREBASE_CONFIGURED__ = window.__FIREBASE_CONFIG__.apiKey !== "YOUR_API_KEY";

  if (window.__FIREBASE_CONFIGURED__ && typeof firebase !== "undefined") {
    try {
      firebase.initializeApp(window.__FIREBASE_CONFIG__);
    } catch (e) {
      console.error("Erro ao iniciar Firebase:", e);
      showFatalError("Erro ao iniciar o Firebase", String(e && e.message || e));
    }
  } else if (window.__FIREBASE_CONFIGURED__) {
    console.error("SDK do Firebase não carregou (firebase é undefined).");
  }
</script>

function Pill({ children, tone = "neutral" }) {
  const map = {
    neutral: { bg: C.surfaceRaised, fg: C.textMuted, bd: C.hairline },
    pago: { bg: C.positiveDim, fg: C.positive, bd: C.positive },
    atrasado: { bg: C.negativeDim, fg: C.negative, bd: C.negative },
    pendente: { bg: C.amberDim, fg: C.amber, bd: C.amber },
  };
  const s = map[tone] || map.neutral;
  return (
    <span style={{
      display: "inline-flex", alignItems: "center", gap: 4,
      fontFamily: fontSans, fontSize: 11, fontWeight: 600, letterSpacing: "0.03em",
      textTransform: "uppercase", padding: "3px 8px", borderRadius: 999,
      background: s.bg, color: s.fg, border: `1px solid ${s.bd}33`,
    }}>{children}</span>
  );
}

function StatusPill({ status }) {
  if (status === "pago") return <Pill tone="pago"><Icon name="Check" size={11} /> Pago</Pill>;
  if (status === "atrasado") return <Pill tone="atrasado"><Icon name="AlertTriangle" size={11} /> Atrasado</Pill>;
  return <Pill tone="pendente"><Icon name="Clock" size={11} /> Pendente</Pill>;
}

function HBarChart({ data, colors }) {
  const max = Math.max(...data.map(d => d.value), 1);
  if (data.length === 0) return <div style={{ color: C.textFaint, fontFamily: fontSans, fontSize: 13, padding: "20px 0" }}>Sem dados no período.</div>;
  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
      {data.map((d, i) => (
        <div key={d.name} style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <div style={{ width: 96, fontSize: 12, color: C.textMuted, fontFamily: fontSans, textAlign: "right", flexShrink: 0 }}>{d.name}</div>
          <div style={{ flex: 1, background: C.surfaceRaised2, borderRadius: 4, height: 14, position: "relative", overflow: "hidden" }}>
            <div style={{ width: `${(d.value / max) * 100}%`, height: "100%", borderRadius: 4, background: colors[i % colors.length] }} />
          </div>
          <div style={{ width: 92, fontFamily: fontMono, fontSize: 11.5, color: C.text, flexShrink: 0 }}>{fmtBRL(d.value)}</div>
        </div>
      ))}
    </div>
  );
}

function DonutChart({ data, colors, size = 132, thickness = 20 }) {
  const total = data.reduce((s, d) => s + d.value, 0) || 1;
  const r = (size - thickness) / 2;
  const circumference = 2 * Math.PI * r;
  let offset = 0;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      <g transform={`translate(${size / 2},${size / 2}) rotate(-90)`}>
        <circle r={r} fill="none" stroke={C.surfaceRaised2} strokeWidth={thickness} />
        {data.map((d, i) => {
          const frac = d.value / total;
          const dash = frac * circumference;
          const el = (
            <circle key={i} r={r} fill="none" stroke={colors[i % colors.length]} strokeWidth={thickness}
              strokeDasharray={`${dash} ${circumference - dash}`} strokeDashoffset={-offset} strokeLinecap="butt" />
          );
          offset += dash;
          return el;
        })}
      </g>
    </svg>
  );
}

function LedgerStrip({ days, monthTitle }) {
  const max = Math.max(...days.map(d => Math.abs(d.net)), 1);
  return (
    <div style={{ background: C.surface, border: `1px solid ${C.hairline}`, borderRadius: 12, padding: "20px 22px 14px" }}>

      <div style={{ position: "relative", height: 92, display: "flex", alignItems: "flex-end", gap: 3 }}>
        <div style={{ position: "absolute", left: 0, right: 0, top: "50%", borderTop: `1px dashed ${C.hairline}` }} />
        {days.map((d, i) => {

          return (
            <div key={i} title={`${d.date}: ${fmtBRL(d.net)}`} style={{

          </div>
        ))}
      </div>
    </div>
  );
}

/* ============================================================
   DASHBOARD
   ============================================================ */
function Dashboard({ transactions, cards, period, setPeriod }) {
  const now = useMemo(() => {
    const iso = todayISO();
    return new Date(iso + "T12:00:00");
  }, []);
  const curY = now.getFullYear(), curM = now.getMonth();

  const filtered = useMemo(() => {
    return transactions.filter(t => {
      const ref = t.date || t.dueDate;
      if (!ref) return false;
      const d = new Date(ref + "T00:00:00");
      if (period === "mes") return d.getMonth() === curM && d.getFullYear() === curY;
      if (period === "semana") {
        const diff = (now - d) / 86400000;
        return diff >= 0 && diff <= 7;
      }
      if (period === "dia") return ref === todayISO();
      return true;
    });
  }, [transactions, period]);

  const entradas = filtered.filter(t => t.type === "entrada").reduce((s, t) => s + t.amount, 0);
  const saidas = filtered.filter(t => t.type === "saida").reduce((s, t) => s + t.amount, 0);
  const saldo = entradas - saidas;

  const paidDays = new Set(filtered.filter(t => t.type === "saida" && t.date).map(t => t.date)).size || 1;
  const mediaDiaria = saidas / paidDays;

  const byCategory = useMemo(() => {
    const map = {};
    filtered.filter(t => t.type === "saida").forEach(t => {
      const key = (t.categoryLabel || "Outros").split(" > ")[0];
      map[key] = (map[key] || 0) + t.amount;
    });
    return Object.entries(map).map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
  }, [filtered]);

  const byMethod = useMemo(() => {
    const map = {};
    filtered.filter(t => t.type === "saida").forEach(t => {
      map[t.paymentMethod] = (map[t.paymentMethod] || 0) + t.amount;
    });
    return Object.entries(map).map(([id, value]) => ({
      id, value, label: PAY_METHODS.find(m => m.id === id)?.label || id,
    }));
  }, [filtered]);

  const pontualidade = useMemo(() => {
    const paid = filtered.filter(t => t.type === "saida" && t.status === "pago");
    let antecipado = 0, noPrazo = 0, atrasado = 0;
    paid.forEach(t => {
      if (t.date < t.dueDate) antecipado++;
      else if (t.date === t.dueDate) noPrazo++;
      else atrasado++;
    });
    atrasado += filtered.filter(t => t.status === "atrasado").length;
    return { antecipado, noPrazo, atrasado, total: antecipado + noPrazo + atrasado || 1 };
  }, [filtered]);

  const days = useMemo(() => {
    const arr = [];
    const daysInMonth = new Date(curY, curM + 1, 0).getDate();
    for (let d = 1; d <= daysInMonth; d++) {
      const date = `${curY}-${String(curM + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
      const dayTx = transactions.filter(t => t.date === date);
      const net = dayTx.reduce((s, t) => s + (t.type === "entrada" ? t.amount : -t.amount), 0);
      arr.push({ date, net });
    }
    return arr;
  }, [transactions]);

  const COLORS = [C.brass, C.positive, C.amber, "#7C8CA6", C.negative, "#8A5CF6"];

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", flexWrap: "wrap", gap: 12 }}>
        <div>
          <div style={{ fontFamily: fontSans, fontSize: 11, letterSpacing: "0.08em", color: C.textFaint, textTransform: "uppercase" }}>Painel analítico</div>
          <h1 style={{ fontFamily: fontDisplay, fontSize: 30, color: C.text, margin: "2px 0 0", fontWeight: 600 }}>Visão geral</h1>
        </div>
        <div style={{ display: "flex", gap: 6, background: C.surface, padding: 4, borderRadius: 10, border: `1px solid ${C.hairline}` }}>
          {[["dia", "Dia"], ["semana", "Semana"], ["mes", "Mês"]].map(([id, label]) => (
            <button key={id} onClick={() => setPeriod(id)} style={{
              fontFamily: fontSans, fontSize: 12.5, fontWeight: 600, padding: "7px 14px", borderRadius: 7,
              border: "none", cursor: "pointer",
              background: period === id ? C.brass : "transparent",
              color: period === id ? "#1a1509" : C.textMuted,
            }}>{label}</button>
          ))}
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(190px, 1fr))", gap: 12 }}>
        <KpiCard label="Entradas" value={entradas} iconName="TrendingUp" tone="positive" />
        <KpiCard label="Saídas" value={saidas} iconName="TrendingDown" tone="negative" />
        <KpiCard label="Saldo do período" value={saldo} iconName="Wallet" tone={saldo >= 0 ? "positive" : "negative"} />
        <KpiCard label="Média diária de gasto" value={mediaDiaria} iconName="PieChart" tone="neutral" />
      </div>

      <LedgerStrip days={days} monthTitle={monthLabel(`${curY}-${String(curM + 1).padStart(2, "0")}`).toUpperCase()} />

      <div style={{ display: "grid", gridTemplateColumns: "1.3fr 1fr", gap: 14 }}>
        <div style={{ background: C.surface, border: `1px solid ${C.hairline}`, borderRadius: 12, padding: "18px 20px" }}>
          <SectionTitle>Gastos por categoria</SectionTitle>
          <div style={{ marginTop: 14 }}>
            <HBarChart data={byCategory} colors={COLORS} />
          </div>
        </div>

        <div style={{ background: C.surface, border: `1px solid ${C.hairline}`, borderRadius: 12, padding: "18px 20px" }}>
          <SectionTitle>Meio de pagamento</SectionTitle>
          <div style={{ height: 190, display: "flex", alignItems: "center", marginTop: 6 }}>
            <div style={{ flexShrink: 0 }}><DonutChart data={byMethod} colors={COLORS} /></div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8, flex: 1, marginLeft: 16 }}>
              {byMethod.map((m, i) => {
                const iconName = PAY_METHODS.find(p => p.id === m.id)?.icon || "Banknote";
                return (
                  <div key={m.id} style={{ display: "flex", alignItems: "center", gap: 8, fontFamily: fontSans, fontSize: 12.5, color: C.textMuted }}>
                    <span style={{ width: 8, height: 8, borderRadius: 2, background: COLORS[i % COLORS.length], flexShrink: 0 }} />
                    <Icon name={iconName} size={13} /> {m.label}
                    <span style={{ marginLeft: "auto", fontFamily: fontMono, color: C.text }}>{fmtBRL(m.value)}</span>
                  </div>
                );
              })}
              {byMethod.length === 0 && <div style={{ color: C.textFaint, fontFamily: fontSans, fontSize: 12.5 }}>Sem dados.</div>}
            </div>
          </div>
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 14 }}>
        <div style={{ background: C.surface, border: `1px solid ${C.hairline}`, borderRadius: 12, padding: "18px 20px" }}>
          <SectionTitle>Pontualidade de pagamentos</SectionTitle>
          <div style={{ display: "flex", flexDirection: "column", gap: 10, marginTop: 12 }}>
            {[
              ["Antecipado", pontualidade.antecipado, C.positive],
              ["No prazo", pontualidade.noPrazo, C.brass],
              ["Em atraso", pontualidade.atrasado, C.negative],
            ].map(([label, val, color]) => (
              <div key={label}>
                <div style={{ display: "flex", justifyContent: "space-between", fontFamily: fontSans, fontSize: 12.5, color: C.textMuted, marginBottom: 4 }}>
                  <span>{label}</span><span style={{ fontFamily: fontMono, color: C.text }}>{val}</span>
                </div>
                <div style={{ height: 6, background: C.surfaceRaised2, borderRadius: 3, overflow: "hidden" }}>
                  <div style={{ width: `${(val / pontualidade.total) * 100}%`, height: "100%", background: color }} />
                </div>
              </div>
            ))}
          </div>
        </div>

        <div style={{ background: C.surface, border: `1px solid ${C.hairline}`, borderRadius: 12, padding: "18px 20px" }}>
          <SectionTitle>Limite dos cartões</SectionTitle>
          <div style={{ display: "flex", flexDirection: "column", gap: 12, marginTop: 12 }}>
            {cards.map(card => {
              const used = transactions
                .filter(t => t.cardId === card.id && t.type === "saida")
                .reduce((s, t) => s + t.amount, 0);
              const pct = Math.min(100, (used / card.limit) * 100);
              return (
                <div key={card.id}>
                  <div style={{ display: "flex", justifyContent: "space-between", fontFamily: fontSans, fontSize: 12.5, color: C.textMuted, marginBottom: 4 }}>
                    <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
                      <span style={{ width: 8, height: 8, borderRadius: 2, background: card.color }} /> {card.name}
                    </span>
                    <span style={{ fontFamily: fontMono, color: C.text }}>{fmtBRL(card.limit - used)} livre</span>
                  </div>
                  <div style={{ height: 6, background: C.surfaceRaised2, borderRadius: 3, overflow: "hidden" }}>
                    <div style={{ width: `${pct}%`, height: "100%", background: card.color }} />
                  </div>
                </div>
              );
            })}
            {cards.length === 0 && <div style={{ color: C.textFaint, fontFamily: fontSans, fontSize: 12.5 }}>Nenhum cartão cadastrado.</div>}
          </div>
        </div>
      </div>
    </div>
  );
}

  const color = tone === "positive" ? C.positive : tone === "negative" ? C.negative : C.brass;
  return (
    <div style={{ background: C.surface, border: `1px solid ${C.hairline}`, borderRadius: 12, padding: "16px 18px" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
        <span style={{ fontFamily: fontSans, fontSize: 11.5, color: C.textFaint, textTransform: "uppercase", letterSpacing: "0.05em" }}>{label}</span>

      <div style={{ fontFamily: fontMono, fontSize: 22, color: C.text, marginTop: 8, fontVariantNumeric: "tabular-nums" }}>

function TransactionModal({ onClose, onSave, defaultType, defaultDueDate }) {
  const [type, setType] = useState(defaultType || "saida");
  const [description, setDescription] = useState("");
  const [amount, setAmount] = useState("");
  const [catId, setCatId] = useState("mercado");
  const [recurrence, setRecurrence] = useState("variavel");
  const [method, setMethod] = useState("pix");
  const [dueDate, setDueDate] = useState(defaultDueDate || todayISO());
  const [status, setStatus] = useState("pago");

  const cat = CAT_LOOKUP[catId];
  const parent = CAT_LOOKUP[cat.parentId] || cat;

  const submit = () => {
    if (!description || !amount) return;
    onSave({
      type, description, amount: parseFloat(String(amount).replace(",", ".")),
      date: status === "pago" ? dueDate : null, dueDate,
      category: catId, categoryLabel: `${parent.label} > ${cat.label}`,
      bucket: cat.bucket || parent.bucket || null, recurrence, paymentMethod: method, status,
    });
  };

  return (
    <div style={overlayStyle} onClick={onClose}>
      <div style={modalStyle} onClick={e => e.stopPropagation()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
          <div style={{ fontFamily: fontDisplay, fontSize: 20, color: C.text, fontStyle: "italic" }}>Novo lançamento</div>

        </div>

        <div style={{ display: "flex", gap: 6, marginBottom: 16 }}>
          {[["entrada", "Recebimento"], ["saida", "Despesa"]].map(([id, label]) => (
            <button key={id} onClick={() => setType(id)} style={{
              flex: 1, fontFamily: fontSans, fontSize: 12.5, fontWeight: 600, padding: "9px 0", borderRadius: 8,
              border: `1px solid ${type === id ? C.brass : C.hairline}`, cursor: "pointer",
              background: type === id ? C.brassDim : "transparent", color: type === id ? C.brass : C.textMuted,
            }}>{label}</button>
          ))}
        </div>

        <Field label="Descrição">
          <input value={description} onChange={e => setDescription(e.target.value)} placeholder="Ex: Mercado da semana" style={inputStyle} />
        </Field>

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          <Field label="Valor (R$)">
            <input value={amount} onChange={e => setAmount(e.target.value)} placeholder="0,00" style={inputStyle} />
          </Field>
          <Field label="Vencimento">
            <input type="date" value={dueDate} onChange={e => setDueDate(e.target.value)} style={inputStyle} />
          </Field>
        </div>

        {type === "saida" && (
          <Field label="Categoria">
            <select value={catId} onChange={e => setCatId(e.target.value)} style={inputStyle}>
              {CATEGORY_TREE.map(c => (
                <optgroup key={c.id} label={c.label}>
                  {c.subs.map(s => <option key={s.id} value={s.id}>{s.label}</option>)}
                </optgroup>
              ))}
            </select>
          </Field>
        )}

        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
          {type === "saida" && (
            <Field label="Natureza do gasto">
              <select value={recurrence} onChange={e => setRecurrence(e.target.value)} style={inputStyle}>
                <option value="fixa">Fixa</option>
                <option value="variavel">Variável</option>
                <option value="esporadica">Esporádica</option>
              </select>
            </Field>
          )}
          <Field label="Meio de pagamento">
            <select value={method} onChange={e => setMethod(e.target.value)} style={inputStyle}>
              {PAY_METHODS.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
              <option value="transferencia">Transferência</option>
            </select>
          </Field>
        </div>

        <Field label="Status">
          <div style={{ display: "flex", gap: 6 }}>
            {["pago", "pendente", "atrasado"].map(s => (
              <button key={s} onClick={() => setStatus(s)} style={{
                flex: 1, fontFamily: fontSans, fontSize: 12, fontWeight: 600, padding: "8px 0", borderRadius: 7,
                border: `1px solid ${status === s ? C.brass : C.hairline}`, cursor: "pointer",
                background: status === s ? C.brassDim : "transparent", color: status === s ? C.brass : C.textMuted,
                textTransform: "capitalize",
              }}>{s}</button>

        </Field>

        <button onClick={submit} style={{ ...btnPrimary, width: "100%", justifyContent: "center", marginTop: 6 }}>
          Salvar lançamento
        </button>
      </div>
    </div>
  );

};
const modalStyle = {

  padding: 22, width: 420, maxWidth: "100%", maxHeight: "88vh", overflowY: "auto",
};
const iconBtn = { background: "none", border: "none", cursor: "pointer", padding: 4, display: "flex" };
const btnPrimary = {
  display: "inline-flex", alignItems: "center", gap: 6, fontFamily: fontSans, fontSize: 13, fontWeight: 700,
  background: C.brass, color: "#1a1509", border: "none", borderRadius: 9, padding: "10px 16px", cursor: "pointer",
};

/* ============================================================
   DESPESAS POR MÊS
   ============================================================ */
function MonthlyExpenses({ transactions, addTransaction }) {
  const [expandedMonth, setExpandedMonth] = useState(null);
  const [addForMonth, setAddForMonth] = useState(null);
  const currentMonthKey = todayISO().slice(0, 7);

  const months = useMemo(() => {
    const map = {};
    transactions.filter(t => t.type === "saida").forEach(t => {
      const ref = t.date || t.dueDate;
      if (!ref) return;
      const key = ref.slice(0, 7);
      if (!map[key]) map[key] = { key, items: [], total: 0, pago: 0, pendente: 0 };
      map[key].items.push(t);
      map[key].total += t.amount;
      if (t.status === "pago") map[key].pago += t.amount;
      else map[key].pendente += t.amount;
    });
    return Object.values(map).sort((a, b) => b.key.localeCompare(a.key));
  }, [transactions]);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div>
        <div style={{ fontFamily: fontSans, fontSize: 11, letterSpacing: "0.08em", color: C.textFaint, textTransform: "uppercase" }}>Histórico</div>
        <h1 style={{ fontFamily: fontDisplay, fontSize: 30, color: C.text, margin: "2px 0 0", fontWeight: 600 }}>Despesas por mês</h1>
      </div>

      {months.length === 0 && (
        <div style={{ background: C.surface, border: `1px solid ${C.hairline}`, borderRadius: 12, padding: 30, textAlign: "center", color: C.textFaint, fontFamily: fontSans, fontSize: 13 }}>
          Nenhuma despesa registrada ainda.
        </div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
        {months.map(month => {
          const isOpen = expandedMonth === month.key;
          const sortedItems = [...month.items].sort((a, b) => (b.date || b.dueDate || "").localeCompare(a.date || a.dueDate || ""));
          return (
            <div key={month.key} style={{ background: C.surface, border: `1px solid ${C.hairline}`, borderRadius: 14, overflow: "hidden" }}>
              <div
                onClick={() => setExpandedMonth(isOpen ? null : month.key)}
                style={{
                  display: "flex", alignItems: "center", gap: 14, padding: "16px 20px", cursor: "pointer",
                  flexWrap: "wrap",
                }}
              >
                {isOpen ? <Icon name="ChevronDown" size={16} color={C.textMuted} /> : <Icon name="ChevronRight" size={16} color={C.textMuted} />}
                <div style={{ display: "flex", alignItems: "center", gap: 8, minWidth: 170 }}>
                  <Icon name="Calendar" size={16} color={C.brass} />
                  <div style={{ fontFamily: fontDisplay, fontSize: 17, fontStyle: "italic", color: C.text, textTransform: "capitalize" }}>
                    {monthLabel(month.key)}
                  </div>
                </div>

                <div style={{ display: "flex", gap: 22, marginLeft: "auto", flexWrap: "wrap" }}>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontFamily: fontSans, fontSize: 10.5, color: C.textFaint, textTransform: "uppercase" }}>Total</div>
                    <div style={{ fontFamily: fontMono, fontSize: 14.5, color: C.text }}>{fmtBRL(month.total)}</div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontFamily: fontSans, fontSize: 10.5, color: C.positive, textTransform: "uppercase" }}>Pago</div>
                    <div style={{ fontFamily: fontMono, fontSize: 14.5, color: C.positive }}>{fmtBRL(month.pago)}</div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ fontFamily: fontSans, fontSize: 10.5, color: C.amber, textTransform: "uppercase" }}>Pendente</div>
                    <div style={{ fontFamily: fontMono, fontSize: 14.5, color: C.amber }}>{fmtBRL(month.pendente)}</div>
                  </div>
                </div>

                <button
                  onClick={(e) => { e.stopPropagation(); setAddForMonth(month.key); if (expandedMonth !== month.key) setExpandedMonth(month.key); }}
                  style={{ ...btnPrimary, background: C.surfaceRaised2, color: C.text, border: `1px solid ${C.hairline}` }}
                >
                  <Icon name="Plus" size={14} /> Despesa
                </button>
              </div>

              {isOpen && (
                <div style={{ borderTop: `1px solid ${C.hairline}` }}>
                  <TransactionTable list={sortedItems} />
                </div>
              )}
            </div>
          );
        })}
      </div>

      {addForMonth && (
        <TransactionModal
          defaultType="saida"
          defaultDueDate={addForMonth === currentMonthKey ? todayISO() : `${addForMonth}-01`}
          onClose={() => setAddForMonth(null)}
          onSave={(tx) => { addTransaction(tx); setAddForMonth(null); }}
        />
      )}
    </div>
  );
}

/* ============================================================
   CARTÕES  (consolidador com parcelas)
   ============================================================ */
function Cards({ cards, transactions, addCardPurchase, addCard }) {
  const [expanded, setExpanded] = useState(cards[0]?.id || null);
  const [openPurchase, setOpenPurchase] = useState(null);
  const [openNewCard, setOpenNewCard] = useState(false);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12 }}>
        <div>
          <div style={{ fontFamily: fontSans, fontSize: 11, letterSpacing: "0.08em", color: C.textFaint, textTransform: "uppercase" }}>Contas consolidadoras</div>
          <h1 style={{ fontFamily: fontDisplay, fontSize: 30, color: C.text, margin: "2px 0 0", fontWeight: 600 }}>Cartões de crédito</h1>
        </div>
        <button onClick={() => setOpenNewCard(true)} style={btnPrimary}><Icon name="Plus" size={15} /> Novo cartão</button>
      </div>

      {cards.map(card => {
        const purchases = transactions.filter(t => t.cardId === card.id);
        const grouped = {};
        purchases.forEach(p => {
          const key = p.purchaseId || p.id;
          if (!grouped[key]) grouped[key] = [];
          grouped[key].push(p);
        });
        const used = purchases.reduce((s, t) => s + t.amount, 0);
        const remaining = card.limit - used;
        const isOpen = expanded === card.id;

        return (
          <div key={card.id} style={{ background: C.surface, border: `1px solid ${C.hairline}`, borderRadius: 14, overflow: "hidden" }}>
            <div onClick={() => setExpanded(isOpen ? null : card.id)} style={{
              display: "flex", alignItems: "center", gap: 16, padding: "18px 20px", cursor: "pointer",
              background: `linear-gradient(120deg, ${card.color}22, transparent 60%)`, flexWrap: "wrap",
            }}>
              {isOpen ? <Icon name="ChevronDown" size={16} color={C.textMuted} /> : <Icon name="ChevronRight" size={16} color={C.textMuted} />}
              <div style={{
                width: 46, height: 30, borderRadius: 6, background: card.color,
                display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0,
              }}>
                <Icon name="CreditCard" size={16} color="#fff" strokeWidth={2} />
              </div>
              <div style={{ flex: 1, minWidth: 140 }}>
                <div style={{ fontFamily: fontSans, fontSize: 14.5, fontWeight: 700, color: C.text }}>{card.name}</div>
                <div style={{ fontFamily: fontSans, fontSize: 11.5, color: C.textFaint }}>
                  Fecha dia {card.closingDay} · vence dia {card.dueDay}
                </div>
              </div>
              <div style={{ textAlign: "right" }}>
                <div style={{ fontFamily: fontMono, fontSize: 16, color: C.text }}>{fmtBRL(used)}</div>
                <div style={{ fontFamily: fontSans, fontSize: 11, color: C.textFaint }}>de {fmtBRL(card.limit)}</div>
              </div>
              <div style={{ width: 90 }}>
                <div style={{ height: 6, background: C.surfaceRaised2, borderRadius: 3, overflow: "hidden" }}>
                  <div style={{ width: `${Math.min(100, (used / card.limit) * 100)}%`, height: "100%", background: card.color }} />
                </div>
                <div style={{ fontFamily: fontMono, fontSize: 10.5, color: C.textFaint, marginTop: 3, textAlign: "right" }}>{fmtBRL(remaining)} livre</div>
              </div>
              <button onClick={(e) => { e.stopPropagation(); setOpenPurchase(card.id); }} style={{ ...btnPrimary, background: C.surfaceRaised2, color: C.text, border: `1px solid ${C.hairline}` }}>
                <Icon name="Plus" size={14} /> Compra
              </button>
            </div>

            {isOpen && (
              <div style={{ borderTop: `1px solid ${C.hairline}`, padding: "6px 20px 16px" }}>
                {Object.keys(grouped).length === 0 && (
                  <div style={{ padding: 20, textAlign: "center", color: C.textFaint, fontFamily: fontSans, fontSize: 13 }}>Nenhuma compra neste cartão ainda.</div>
                )}
                {Object.entries(grouped).map(([key, items]) => {
                  const first = items[0];
                  const isInstallment = items.length > 1 || first.installment;
                  const paidCount = items.filter(i => i.status === "pago").length;
                  return (
                    <div key={key} style={{ position: "relative", paddingLeft: 22, marginTop: 10 }}>
                      <div style={{ position: "absolute", left: 6, top: 0, bottom: 0, width: 1, background: C.hairline }} />
                      <div style={{ position: "absolute", left: 6, top: 16, width: 14, height: 1, background: C.hairline }} />
                      <div style={{ background: C.surfaceRaised, border: `1px solid ${C.hairlineSoft}`, borderRadius: 10, padding: "12px 14px" }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                          <div style={{ fontFamily: fontSans, fontSize: 13, fontWeight: 600, color: C.text }}>
                            {first.description.replace(/\s\(\d+\/\d+\)$/, "")}
                          </div>
                          <div style={{ fontFamily: fontMono, fontSize: 13.5, color: C.text }}>
                            {fmtBRL(items.reduce((s, i) => s + i.amount, 0))}
                          </div>
                        </div>
                        <div style={{ fontFamily: fontSans, fontSize: 11.5, color: C.textFaint, marginTop: 2 }}>{first.categoryLabel}</div>
                        {isInstallment && first.installment && (
                          <div style={{ marginTop: 8 }}>
                            <div style={{ display: "flex", justifyContent: "space-between", fontFamily: fontMono, fontSize: 10.5, color: C.textFaint, marginBottom: 3 }}>
                              <span>{paidCount}/{items.length} parcelas pagas</span>
                              <span>{fmtBRL(first.amount)}/mês</span>
                            </div>
                            <div style={{ height: 4, background: C.surfaceRaised2, borderRadius: 2, overflow: "hidden" }}>
                              <div style={{ width: `${(paidCount / items.length) * 100}%`, height: "100%", background: card.color }} />
                            </div>
                          </div>
                        )}
                        {!isInstallment && (
                          <div style={{ marginTop: 6 }}><StatusPill status={first.status} /></div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}

      {cards.length === 0 && (
        <div style={{ background: C.surface, border: `1px solid ${C.hairline}`, borderRadius: 12, padding: 30, textAlign: "center", color: C.textFaint, fontFamily: fontSans, fontSize: 13 }}>
          Nenhum cartão cadastrado ainda.
        </div>
      )}

      {openPurchase && (
        <PurchaseModal cardId={openPurchase} onClose={() => setOpenPurchase(null)}
          onSave={(p) => { addCardPurchase(openPurchase, p); setOpenPurchase(null); }} />
      )}
      {openNewCard && (
        <NewCardModal onClose={() => setOpenNewCard(false)} onSave={(c) => { addCard(c); setOpenNewCard(false); }} />
      )}
    </div>
  );
}

/* ============================================================
   MATRIZ 50/30/20
   ============================================================ */
function Matrix({ transactions }) {
  const curMonthKey = todayISO().slice(0, 7);
  const monthTx = transactions.filter(t => t.type === "saida" && (t.date || t.dueDate || "").startsWith(curMonthKey));
  const income = transactions.filter(t => t.type === "entrada" && (t.date || "").startsWith(curMonthKey)).reduce((s, t) => s + t.amount, 0);

  const buckets = { essenciais: 0, lazer: 0, investimentos: 0 };
  monthTx.forEach(t => { if (t.bucket) buckets[t.bucket] += t.amount; });

  const targets = { essenciais: income * 0.5, lazer: income * 0.3, investimentos: income * 0.2 };
  const labels = { essenciais: "Essenciais", lazer: "Lazer", investimentos: "Investimentos" };
  const targetPct = { essenciais: 50, lazer: 30, investimentos: 20 };
  const colors = { essenciais: C.brass, lazer: C.amber, investimentos: C.positive };

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>
      <div>
        <div style={{ fontFamily: fontSans, fontSize: 11, letterSpacing: "0.08em", color: C.textFaint, textTransform: "uppercase" }}>Framework 50/30/20</div>
        <h1 style={{ fontFamily: fontDisplay, fontSize: 30, color: C.text, margin: "2px 0 0", fontWeight: 600 }}>Matriz de gastos</h1>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(240px,1fr))", gap: 14 }}>
        {Object.keys(buckets).map(key => {
          const actualPct = income ? (buckets[key] / income) * 100 : 0;
          const over = actualPct > targetPct[key];
          return (
            <div key={key} style={{ background: C.surface, border: `1px solid ${C.hairline}`, borderRadius: 14, padding: "20px 22px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
                <div style={{ fontFamily: fontDisplay, fontSize: 17, fontStyle: "italic", color: C.text }}>{labels[key]}</div>
                <div style={{ fontFamily: fontSans, fontSize: 11.5, color: C.textFaint }}>meta {targetPct[key]}%</div>
              </div>
              <div style={{ fontFamily: fontMono, fontSize: 28, color: colors[key], marginTop: 10 }}>{actualPct.toFixed(1)}%</div>
              <div style={{ fontFamily: fontSans, fontSize: 12.5, color: C.textMuted, marginTop: 2 }}>{fmtBRL(buckets[key])} de {fmtBRL(targets[key])}</div>
              <div style={{ height: 8, background: C.surfaceRaised2, borderRadius: 4, overflow: "hidden", marginTop: 12, position: "relative" }}>
                <div style={{ width: `${Math.min(100, actualPct)}%`, height: "100%", background: colors[key] }} />
                <div style={{ position: "absolute", left: `${targetPct[key]}%`, top: -3, width: 2, height: 14, background: C.text, opacity: 0.6 }} />
              </div>
              <div style={{ marginTop: 10, fontFamily: fontSans, fontSize: 12, color: over ? C.negative : C.positive, fontWeight: 600 }}>
                {over ? `${(actualPct - targetPct[key]).toFixed(1)} p.p. acima da meta` : `${(targetPct[key] - actualPct).toFixed(1)} p.p. dentro da meta`}
              </div>
            </div>
          );
        })}
      </div>

      <div style={{ background: C.surface, border: `1px solid ${C.hairline}`, borderRadius: 14, padding: "20px 22px" }}>
        <SectionTitle>Composição do mês</SectionTitle>
        <div style={{ display: "flex", height: 34, borderRadius: 8, overflow: "hidden", marginTop: 14, border: `1px solid ${C.hairline}` }}>
          {Object.keys(buckets).map(key => {
            const w = income ? (buckets[key] / income) * 100 : 0;
            return <div key={key} style={{ width: `${w}%`, background: colors[key] }} title={labels[key]} />;
          })}
        </div>
        <div style={{ display: "flex", gap: 18, marginTop: 12, flexWrap: "wrap" }}>
          {Object.keys(buckets).map(key => (
            <div key={key} style={{ display: "flex", alignItems: "center", gap: 6, fontFamily: fontSans, fontSize: 12.5, color: C.textMuted }}>
              <span style={{ width: 9, height: 9, borderRadius: 2, background: colors[key] }} /> {labels[key]} · {fmtBRL(buckets[key])}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

  const [loadingData, setLoadingData] = useState(true);
  const [tab, setTabState] = useState("dashboard");
  const [period, setPeriod] = useState("mes");

  useEffect(() => {
    if (!window.__FIREBASE_CONFIGURED__) return;
    if (typeof firebase === "undefined" || !firebase.auth) {
      setAuthError("O SDK do Firebase não carregou (verifique bloqueadores de anúncio/firewall e recarregue a página).");
      return;
    }
    let unsub = () => {};
    try {
      const auth = firebase.auth();
      unsub = auth.onAuthStateChanged(user => {
        if (user) {
          setUid(user.uid);
        } else {
          auth.signInAnonymously().catch(err => {
            console.error(err);
            setAuthError(err.code ? `${err.code}: ${err.message}` : err.message);
          });
        }
      });
    } catch (err) {
      console.error(err);
      setAuthError(String(err && err.message || err));
    }
    return () => unsub();
  }, []);

  useEffect(() => {
    if (!uid) return;
    const db = firebase.firestore();
    const userRef = db.collection("users").doc(uid);
    const txRef = userRef.collection("transactions");
    const cardsRef = userRef.collection("cards");
    const metaRef = userRef.collection("meta").doc("init");

    let cancelled = false;

    (async () => {
      try {
        const metaSnap = await metaRef.get();
        if (!metaSnap.exists && !cancelled) {
          const batch = db.batch();
          seedTransactions().forEach(t => batch.set(txRef.doc(), t));
          initialCards.forEach(c => batch.set(cardsRef.doc(), c));
          batch.set(metaRef, { initialized: true, at: Date.now() });
          await batch.commit();
        }
      } catch (e) {
        console.error("Erro ao semear dados iniciais:", e);
      }
    })();

    const unsubTx = txRef.onSnapshot(snap => {
      setTransactions(snap.docs.map(d => ({ id: d.id, ...d.data() })));
      setLoadingData(false);
    }, err => { console.error(err); setLoadingData(false); });

    const unsubCards = cardsRef.onSnapshot(snap => {
      setCards(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    }, err => console.error(err));

    return () => { cancelled = true; unsubTx(); unsubCards(); };
  }, [uid]);

  const addTransaction = async (tx) => {
    if (!uid) return;
    const clean = {};
    Object.keys(tx).forEach(k => { clean[k] = tx[k] === undefined ? null : tx[k]; });
    await firebase.firestore().collection("users").doc(uid).collection("transactions").add(clean);
  };

  const addCardPurchase = async (cardId, p) => {
    if (!uid) return;
    const db = firebase.firestore();
    const txRef = db.collection("users").doc(uid).collection("transactions");
    const purchaseId = p.installments > 1 ? txRef.doc().id : null;
    const per = p.amount / p.installments;
    const cat = CAT_LOOKUP[p.category];
    const parent = CAT_LOOKUP[cat.parentId] || cat;
    const batch = db.batch();
    for (let i = 0; i < p.installments; i++) {
      batch.set(txRef.doc(), {
        type: "saida",
        description: p.installments > 1 ? `${p.description} (${i + 1}/${p.installments})` : p.description,
        amount: per,
        date: i === 0 ? p.date : null,
        dueDate: addMonths(p.date, i),
        category: p.category,
        categoryLabel: `${parent.label} > ${cat.label}`,
        bucket: cat.bucket || parent.bucket || null,
        recurrence: "esporadica",
        paymentMethod: "credito",
        cardId,
        purchaseId: p.installments > 1 ? purchaseId : null,
        installment: p.installments > 1 ? [i + 1, p.installments] : null,
        status: i === 0 ? "pago" : "pendente",
      });
    }
    await batch.commit();
  };

  const addCard = async (c) => {
    if (!uid) return;
    await firebase.firestore().collection("users").doc(uid).collection("cards").add(c);
  };

  const nav = [
    { id: "dashboard", label: "Dashboard", icon: "LayoutGrid" },
    { id: "lancamentos", label: "Lançamentos", icon: "Wallet" },
    { id: "meses", label: "Despesas por Mês", icon: "Calendar" },
    { id: "cartoes", label: "Cartões", icon: "CreditCard" },
    { id: "matriz", label: "Matriz 50/30/20", icon: "PieChart" },
  ];

  if (!window.__FIREBASE_CONFIGURED__) return <SetupScreen />;
  if (authError) return <LoadingScreen label={`Erro de autenticação: ${authError}`} />;
  if (!uid || loadingData) return <LoadingScreen label="Conectando ao Firebase..." />;

  return (
    <div style={{ fontFamily: fontSans, background: C.bg, minHeight: "100vh", color: C.text, display: "flex" }}>
      <div style={{
        width: 220, flexShrink: 0, background: C.surface, borderRight: `1px solid ${C.hairline}`,
        padding: "24px 14px", display: "flex", flexDirection: "column", gap: 4,
      }}>
        <div style={{ padding: "0 10px 22px" }}>
          <div style={{ fontFamily: fontDisplay, fontSize: 19, fontWeight: 600, color: C.text, lineHeight: 1.15 }}>
            Fluxo<span style={{ color: C.brass, fontStyle: "italic" }}>&amp;</span>Caixa
          </div>
          <div style={{ fontFamily: fontSans, fontSize: 10.5, color: C.textFaint, letterSpacing: "0.05em", marginTop: 2 }}>GESTÃO FINANCEIRA PESSOAL</div>
        </div>
        {nav.map(item => {
          const active = tab === item.id;
          return (
            <button key={item.id} onClick={() => setTabState(item.id)} style={{
              display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", borderRadius: 9,
              border: "none", cursor: "pointer", textAlign: "left",
              background: active ? C.surfaceRaised2 : "transparent",
              color: active ? C.brass : C.textMuted,
              fontFamily: fontSans, fontSize: 13.5, fontWeight: active ? 600 : 500,
            }}>
              <Icon name={item.icon} size={16} /> {item.label}
            </button>
          );
        })}

        <div style={{ marginTop: "auto", padding: "14px 12px", borderTop: `1px solid ${C.hairline}` }}>
          <div style={{ fontFamily: fontSans, fontSize: 11, color: C.textFaint }}>Conectado ao Firebase</div>
          <div style={{ fontFamily: fontMono, fontSize: 10, color: C.textFaint, marginTop: 2, wordBreak: "break-all" }}>uid: {uid.slice(0, 12)}…</div>
        </div>
      </div>

      <div style={{ flex: 1, padding: "28px 32px", maxWidth: 1180 }}>
        {tab === "dashboard" && <Dashboard transactions={transactions} cards={cards} period={period} setPeriod={setPeriod} />}
        {tab === "lancamentos" && <Transactions transactions={transactions} addTransaction={addTransaction} />}
        {tab === "meses" && <MonthlyExpenses transactions={transactions} addTransaction={addTransaction} />}
        {tab === "cartoes" && <Cards cards={cards} transactions={transactions} addCardPurchase={addCardPurchase} addCard={addCard} />}
        {tab === "matriz" && <Matrix transactions={transactions} />}
      </div>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  componentDidCatch(error, info) { console.error("Erro no app:", error, info); }
  render() {
    if (this.state.error) {
      return <LoadingScreen label={`Erro ao renderizar o app: ${this.state.error.message || this.state.error}`} />;
    }
    return this.props.children;
  }
}

try {
  const rootEl = document.getElementById("root");
  const root = ReactDOM.createRoot(rootEl);
  root.render(<ErrorBoundary><App /></ErrorBoundary>);
  rootEl.dataset.appMounted = "1";
} catch (e) {
  console.error("Falha ao montar o app:", e);
  if (typeof showFatalError === "function") {
    showFatalError("Falha ao montar o app", String(e && e.message || e));
  }
}
</script>
</body>
</html>
