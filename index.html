HTML
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Razão — Planejamento e Gestão Financeira Pessoal</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#142032;
    --ink-soft:#3a4a63;
    --paper:#F5F2E8;
    --paper-line:#E1DAC4;
    --card:#FFFEF9;
    --brass:#A97C36;
    --brass-dark:#8A6528;
    --sage:#3F6B57;
    --sage-bg:#E7EFE9;
    --rust:#9C4A3C;
    --rust-bg:#F4E6E2;
  }
  *{box-sizing:border-box;}
  body{
    background-color:var(--paper);
    background-image: linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 2.25rem;
    color:var(--ink);
    font-family:'Inter',sans-serif;
  }
  .font-display{font-family:'Fraunces',serif;}
  .font-mono{font-family:'IBM Plex Mono',monospace;}
  .tabular{font-variant-numeric: tabular-nums;}
 
  .ledger-tab{
    position:relative;
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:.04em;
    transition: transform .15s ease, background-color .15s ease, color .15s ease;
  }
  .ledger-tab:hover{ transform: translateX(2px); }
  .ledger-tab.active{
    background:var(--card);
    color:var(--ink);
    box-shadow: inset 3px 0 0 var(--brass);
  }
  .ledger-tab:not(.active){ color:#8b8262; }
 
  .paper-card{
    background:var(--card);
    border:1px solid var(--paper-line);
    box-shadow: 0 1px 0 var(--paper-line), 0 8px 20px -12px rgba(20,32,50,.25);
  }
 
  .stamp{
    font-family:'IBM Plex Mono',monospace;
    letter-spacing:.08em;
    border:1.5px solid currentColor;
    border-radius:3px;
  }
 
  input, select{
    background:var(--card);
    border:1px solid var(--paper-line);
    color:var(--ink);
  }
  input:focus, select:focus{
    outline:2px solid var(--brass);
    outline-offset:1px;
    border-color:var(--brass);
  }
 
  .btn-primary{
    background:var(--brass);
    color:var(--card);
    transition: background-color .15s ease, transform .1s ease;
  }
  .btn-primary:hover{ background:var(--brass-dark); }
  .btn-primary:active{ transform: translateY(1px); }
  .row-hover:hover{ background:#FBF9F2; }
</style>
</head>
<body class="min-h-screen">

<div class="flex flex-col md:flex-row min-h-screen">
  <!-- Sidebar -->
  <aside class="md:w-60 w-full border-b md:border-b-0 md:border-r" style="border-color:var(--paper-line); background:#EFEADA;">
    <div class="px-5 pt-6 pb-5 hidden md:block">
      <h1 class="font-display text-2xl font-semibold" style="color:var(--ink);">Razão</h1>
      <p class="text-[11px] font-mono mt-1" style="color:#8b8262;">planejamento & orçamento</p>
    </div>
    <nav id="nav-tabs" class="flex md:flex-col overflow-x-auto md:overflow-visible">
      <!-- Injetado via JS -->
    </nav>
  </aside>
 
  <!-- Main -->
  <main class="flex-1 px-4 sm:px-8 py-6 md:py-8 max-w-7xl">
    <div id="view-root"></div>
  </main>
</div>

<!-- Modal Geral de Edição -->
<div id="edit-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
  <div class="paper-card rounded-sm w-full max-w-lg p-6 relative">
    <button id="close-modal" class="absolute top-4 right-4 text-sm font-mono opacity-60 hover:opacity-100">✕ fechar</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
/* =========================================================
   ESTADO CENTRAL
   ========================================================= */
const STORAGE_KEY = 'razao_app_state_v2';

const DEFAULT_ACCOUNTS = [
  { id: 'acc-1', name: 'Conta Corrente Principal', type: 'corrente', balance: 3500.00 },
  { id: 'acc-2', name: 'Reserva Poupança', type: 'poupanca', balance: 12000.00 },
  { id: 'acc-3', name: 'Vale Refeição / VR', type: 'vr', balance: 850.00 }
];

const DEFAULT_CATEGORIES = [
  { id: 'cat-casa', name: 'Casa', subcategories: [{ id: 'sub-energia', name: 'Energia/Água' }, { id: 'sub-internet', name: 'Internet' }] },
  { id: 'cat-carro', name: 'Carro', subcategories: [{ id: 'sub-gasolina', name: 'Gasolina' }, { id: 'sub-manutencao', name: 'Manutenção' }] },
  { id: 'cat-alimentacao', name: 'Alimentação', subcategories: [{ id: 'sub-mercado', name: 'Mercado' }, { id: 'sub-lanche', name: 'Lanche/Restaurante' }] },
  { id: 'cat-genesis', name: 'Gênesis', subcategories: [{ id: 'sub-geral', name: 'Geral' }] }
];

function loadState(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try { return JSON.parse(raw); } catch(e){}
  }
  return {
    accounts: DEFAULT_ACCOUNTS,
    categories: DEFAULT_CATEGORIES,
    creditCards: [
      { id: 'card-1', name: 'CARTÃO MASTER 1095', total_limit: 8000, closing_day: 3, due_day: 13 },
      { id: 'card-2', name: 'CARTÃO VISA 7751', total_limit: 5000, closing_day: 27, due_day: 10 }
    ],
    expenses: [],
    incomes: []
  };
}

function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

let state = loadState();
saveState();

/* =========================================================
   UTILITÁRIOS
   ========================================================= */
function uuid(){ return 'ax-'+Math.random().toString(36).substr(2, 9); }
function formatBRL(v){ return (Number(v)||0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' }); }
function formatDateBR(iso){ if(!iso) return '—'; const [y,m,d] = iso.split('-'); return `${d}/${m}/${y}`; }
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* =========================================================
   NAVEGAÇÃO
   ========================================================= */
const TABS = [
  { id:'projection', label:'Visão Futura (12M)' },
  { id:'expenses',   label:'Despesas & Contas' },
  { id:'cards',      label:'Cartões de Crédito' },
  { id:'accounts',   label:'Saldos & Contas' },
  { id:'categories', label:'Categorias' }
];

let currentTab = 'projection';

function renderNav(){
  const nav = document.getElementById('nav-tabs');
  nav.innerHTML = TABS.map((t,i) => `
    <button class="ledger-tab ${t.id===currentTab?'active':''} whitespace-nowrap md:whitespace-normal text-left px-5 py-3 text-sm font-medium border-b md:border-b-0 md:border-r"
      style="border-color:var(--paper-line);" data-tab="${t.id}">
      <span class="opacity-60">${String(i+1).padStart(2,'0')}</span>&nbsp; ${t.label}
    </button>
  `).join('');
  nav.querySelectorAll('[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => { currentTab = btn.dataset.tab; renderNav(); renderView(); });
  });
}

function renderView(){
  const root = document.getElementById('view-root');
  if(currentTab === 'projection') renderProjectionView(root);
  if(currentTab === 'expenses') renderExpensesView(root);
  if(currentTab === 'cards') renderCardsView(root);
  if(currentTab === 'accounts') renderAccountsView(root);
  if(currentTab === 'categories') renderCategoriesView(root);
}

/* =========================================================
   MÓDULO: PROJEÇÃO FUTURA (+12 MESES)
   ========================================================= */
function renderProjectionView(root){
  const now = new Date();
  const months = [];
  for(let i=0; i<12; i++){
    const d = new Date(now.getFullYear(), now.getMonth() + i, 1);
    const key = d.toISOString().slice(0,7);
    const label = d.toLocaleDateString('pt-BR', { month:'short', year:'2-digit' }).replace('.','');
    months.push({ key, label, year: d.getFullYear(), month: d.getMonth() });
  }

  // Totais agregados
  const totalDisponivel = state.accounts.reduce((s, a) => s + Number(a.balance||0), 0);
  const totalPagoMesAtual = state.expenses.filter(e => e.due_date.slice(0,7) === months[0].key && e.status === 'paid').reduce((s,e) => s + Number(e.amount||0), 0);
  const totalAPagarMesAtual = state.expenses.filter(e => e.due_date.slice(0,7) === months[0].key && e.status !== 'paid').reduce((s,e) => s + Number(e.amount||0), 0);

  root.innerHTML = `
    <div class="mb-6 flex justify-between items-end flex-wrap gap-4">
      <div>
        <p class="font-mono text-xs tracking-widest" style="color:var(--brass);">PLANEJAMENTO E VISÃO FUTURA</p>
        <h2 class="font-display text-3xl md:text-4xl">Projeção dos Próximos 12 Meses</h2>
      </div>
    </div>

    <!-- KPIs de caixa -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
      <div class="paper-card p-5">
        <p class="font-mono text-xs text-gray-500">SALDO TOTAL EM CONTAS</p>
        <p class="font-mono text-2xl font-semibold mt-1" style="color:var(--sage);">${formatBRL(totalDisponivel)}</p>
        <p class="text-[11px] text-gray-400 mt-1">Disponível em todas as contas cadastradas</p>
      </div>
      <div class="paper-card p-5">
        <p class="font-mono text-xs text-gray-500">REALIZADO NO MÊS (PAGO)</p>
        <p class="font-mono text-2xl font-semibold mt-1" style="color:var(--ink);">${formatBRL(totalPagoMesAtual)}</p>
        <p class="text-[11px] text-gray-400 mt-1">Apenas gastos efetivamente quitados</p>
      </div>
      <div class="paper-card p-5">
        <p class="font-mono text-xs text-gray-500">A PAGAR NO MÊS (PENDENTE)</p>
        <p class="font-mono text-2xl font-semibold mt-1" style="color:var(--rust);">${formatBRL(totalAPagarMesAtual)}</p>
        <p class="text-[11px] text-gray-400 mt-1">Compromissos pendentes do mês atual</p>
      </div>
    </div>

    <!-- Tabela da Projeção de 12 Meses -->
    <div class="paper-card overflow-hidden">
      <div class="p-4 border-b flex justify-between items-center" style="border-color:var(--paper-line);">
        <h3 class="font-display text-lg">Resumo de Saídas Previstas por Mês</h3>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm font-mono">
          <thead>
            <tr class="bg-amber-50/50 text-left text-xs border-b" style="border-color:var(--paper-line);">
              <th class="p-3">Mês</th>
              <th class="p-3 text-right">Já Pago</th>
              <th class="p-3 text-right">A Pagar (Pendente)</th>
              <th class="p-3 text-right">Total Previsto</th>
              <th class="p-3 text-center">Ações</th>
            </tr>
          </thead>
          <tbody>
            ${months.map(m => {
              const items = state.expenses.filter(e => e.due_date.slice(0,7) === m.key);
              const pago = items.filter(e => e.status === 'paid').reduce((s,e) => s + Number(e.amount||0), 0);
              const aPagar = items.filter(e => e.status !== 'paid').reduce((s,e) => s + Number(e.amount||0), 0);
              const total = pago + aPagar;

              return `
                <tr class="border-b row-hover" style="border-color:var(--paper-line);">
                  <td class="p-3 font-bold capitalize">${m.label}</td>
                  <td class="p-3 text-right text-emerald-700">${formatBRL(pago)}</td>
                  <td class="p-3 text-right text-rose-700">${formatBRL(aPagar)}</td>
                  <td class="p-3 text-right font-bold">${formatBRL(total)}</td>
                  <td class="p-3 text-center">
                    <button onclick="viewMonthDetails('${m.key}')" class="text-xs border px-2 py-1 rounded hover:bg-amber-100">Ver Itens</button>
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

window.viewMonthDetails = function(monthKey){
  const items = state.expenses.filter(e => e.due_date.slice(0,7) === monthKey);
  const modal = document.getElementById('edit-modal');
  const content = document.getElementById('modal-content');

  content.innerHTML = `
    <h3 class="font-display text-xl mb-4">Lançamentos do Mês (${monthKey})</h3>
    <div class="max-h-96 overflow-y-auto">
      ${items.length === 0 ? '<p class="text-sm text-gray-500">Nenhum lançamento previsto para este mês.</p>' : `
        <table class="w-full text-xs font-mono">
          <thead>
            <tr class="border-b text-left">
              <th class="py-2">Descrição</th>
              <th class="py-2 text-right">Valor</th>
              <th class="py-2 text-center">Status</th>
              <th class="py-2 text-right">Ação</th>
            </tr>
          </thead>
          <tbody>
            ${items.map(item => `
              <tr class="border-b">
                <td class="py-2">${item.description}</td>
                <td class="py-2 text-right">${formatBRL(item.amount)}</td>
                <td class="py-2 text-center">${item.status==='paid'?'<span class="text-emerald-700 font-bold">PAGO</span>':'<span class="text-amber-700 font-bold">A PAGAR</span>'}</td>
                <td class="py-2 text-right">
                  <button onclick="editExpense('${item.id}')" class="text-blue-600 underline text-[11px]">Editar</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `}
    </div>
  `;
  modal.classList.remove('hidden');
};

/* =========================================================
   MÓDULO: DESPESAS & CONTAS (COM GERADOR DE PROJEÇÃO)
   ========================================================= */
function renderExpensesView(root){
  root.innerHTML = `
    <div class="mb-6">
      <p class="font-mono text-xs tracking-widest" style="color:var(--brass);">CADASTRO E PROJEÇÃO</p>
      <h2 class="font-display text-3xl">Lançar Nova Despesa / Conta</h2>
    </div>

    <form id="exp-form" class="paper-card p-6 mb-8 grid grid-cols-1 md:grid-cols-3 gap-4">
      <div class="md:col-span-2">
        <label class="block text-xs font-mono mb-1">Descrição</label>
        <input type="text" id="exp-desc" required placeholder="Ex: Internet, Magalu Lavadora..." class="w-full p-2 text-sm rounded">
      </div>
      <div>
        <label class="block text-xs font-mono mb-1">Valor da Parcela / Mensalidade (R$)</label>
        <input type="number" id="exp-amount" step="0.01" required placeholder="0,00" class="w-full p-2 text-sm font-mono rounded">
      </div>

      <div>
        <label class="block text-xs font-mono mb-1">Vencimento Inicial</label>
        <input type="date" id="exp-date" required value="${todayISO()}" class="w-full p-2 text-sm font-mono rounded">
      </div>

      <div>
        <label class="block text-xs font-mono mb-1">Tipo de Lançamento</label>
        <select id="exp-type" class="w-full p-2 text-sm rounded">
          <option value="single">Único (Apenas este mês)</option>
          <option value="monthly">Mensal / Fixo (Sempre no mesmo valor)</option>
          <option value="installment">Parcelado (Ex: 3x, 5x, 10x)</option>
        </select>
      </div>

      <div id="box-installments" class="hidden">
        <label class="block text-xs font-mono mb-1">Nº de Parcelas</label>
        <input type="number" id="exp-installments-cnt" min="2" max="48" value="3" class="w-full p-2 text-sm font-mono rounded">
      </div>

      <div>
        <label class="block text-xs font-mono mb-1">Forma de Pagamento</label>
        <select id="exp-method" class="w-full p-2 text-sm rounded">
          <option value="boleto">Boleto / Débito em Conta</option>
          <option value="pix">PIX</option>
          ${state.creditCards.map(c => `<option value="card-${c.id}">${c.name}</option>`).join('')}
        </select>
      </div>

      <div>
        <label class="block text-xs font-mono mb-1">Categoria</label>
        <select id="exp-cat" class="w-full p-2 text-sm rounded">
          ${state.categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}
        </select>
      </div>

      <div>
        <label class="block text-xs font-mono mb-1">Status Inicial</label>
        <select id="exp-status" class="w-full p-2 text-sm rounded">
          <option value="pending">A PAGAR / VALOR DEVEDOR</option>
          <option value="paid">PAGO</option>
        </select>
      </div>

      <div class="md:col-span-3 flex justify-end mt-2">
        <button type="submit" class="btn-primary px-6 py-2 rounded text-sm font-semibold">Cadastrar e Gerar Projeção</button>
      </div>
    </form>

    <!-- Lista de Lançamentos -->
    <div class="paper-card overflow-hidden">
      <div class="p-4 border-b"><h3 class="font-display text-lg">Todos os Lançamentos Registrados</h3></div>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="bg-amber-50/50 text-left font-mono text-xs border-b">
              <th class="p-3">Vencimento</th>
              <th class="p-3">Descrição</th>
              <th class="p-3 text-right">Valor</th>
              <th class="p-3 text-center">Status</th>
              <th class="p-3 text-right">Ação</th>
            </tr>
          </thead>
          <tbody>
            ${state.expenses.sort((a,b)=>b.due_date.localeCompare(a.due_date)).map(exp => `
              <tr class="border-b row-hover">
                <td class="p-3 font-mono">${formatDateBR(exp.due_date)}</td>
                <td class="p-3">${exp.description}</td>
                <td class="p-3 text-right font-mono font-semibold">${formatBRL(exp.amount)}</td>
                <td class="p-3 text-center">
                  <button onclick="toggleExpenseStatus('${exp.id}')" class="text-xs font-mono px-2 py-1 border rounded ${exp.status==='paid'?'bg-emerald-100 text-emerald-800 border-emerald-300':'bg-amber-100 text-amber-800 border-amber-300'}">
                    ${exp.status === 'paid' ? 'PAGO' : 'A PAGAR'}
                  </button>
                </td>
                <td class="p-3 text-right">
                  <button onclick="editExpense('${exp.id}')" class="text-xs text-blue-600 underline mr-2">Editar</button>
                  <button onclick="deleteExpense('${exp.id}')" class="text-xs text-rose-600 underline">Excluir</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;

  document.getElementById('exp-type').addEventListener('change', (e) => {
    document.getElementById('box-installments').classList.toggle('hidden', e.target.value !== 'installment');
  });

  document.getElementById('exp-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const desc = document.getElementById('exp-desc').value;
    const amount = parseFloat(document.getElementById('exp-amount').value);
    const dateIso = document.getElementById('exp-date').value;
    const type = document.getElementById('exp-type').value;
    const method = document.getElementById('exp-method').value;
    const cat = document.getElementById('exp-cat').value;
    const status = document.getElementById('exp-status').value;

    const baseDate = new Date(dateIso + 'T00:00:00');

    if(type === 'single'){
      state.expenses.push({ id: uuid(), description: desc, amount, due_date: dateIso, status, method, category_id: cat });
    } else if(type === 'monthly'){
      // Gera para os próximos 12 meses
      for(let i=0; i<12; i++){
        const d = new Date(baseDate.getFullYear(), baseDate.getMonth() + i, baseDate.getDate());
        state.expenses.push({
          id: uuid(),
          description: `${desc} (${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear().toString().slice(2)})`,
          amount,
          due_date: d.toISOString().slice(0,10),
          status: i === 0 ? status : 'pending',
          method,
          category_id: cat
        });
      }
    } else if(type === 'installment'){
      const cnt = parseInt(document.getElementById('exp-installments-cnt').value) || 2;
      for(let i=1; i<=cnt; i++){
        const d = new Date(baseDate.getFullYear(), baseDate.getMonth() + (i-1), baseDate.getDate());
        state.expenses.push({
          id: uuid(),
          description: `${desc} (${i}/${cnt})`,
          amount,
          due_date: d.toISOString().slice(0,10),
          status: i === 1 ? status : 'pending',
          method,
          category_id: cat
        });
      }
    }

    saveState();
    renderView();
  });
}

window.toggleExpenseStatus = function(id){
  const exp = state.expenses.find(e => e.id === id);
  if(exp){
    exp.status = exp.status === 'paid' ? 'pending' : 'paid';
    saveState();
    renderView();
  }
};

window.deleteExpense = function(id){
  if(confirm('Excluir este lançamento?')){
    state.expenses = state.expenses.filter(e => e.id !== id);
    saveState();
    renderView();
  }
};

window.editExpense = function(id){
  const exp = state.expenses.find(e => e.id === id);
  if(!exp) return;

  const modal = document.getElementById('edit-modal');
  const content = document.getElementById('modal-content');

  content.innerHTML = `
    <h3 class="font-display text-xl mb-4">Editar Lançamento Individual</h3>
    <form id="edit-exp-form" class="space-y-3">
      <div>
        <label class="block text-xs font-mono">Descrição</label>
        <input type="text" id="edit-desc" value="${exp.description}" class="w-full p-2 text-sm rounded border">
      </div>
      <div>
        <label class="block text-xs font-mono">Valor (R$) (Altere caso haja taxa/multa)</label>
        <input type="number" id="edit-amount" step="0.01" value="${exp.amount}" class="w-full p-2 text-sm font-mono rounded border">
      </div>
      <div>
        <label class="block text-xs font-mono">Data de Vencimento</label>
        <input type="date" id="edit-date" value="${exp.due_date}" class="w-full p-2 text-sm font-mono rounded border">
      </div>
      <div>
        <label class="block text-xs font-mono">Status</label>
        <select id="edit-status" class="w-full p-2 text-sm rounded border">
          <option value="pending" ${exp.status!=='paid'?'selected':''}>VALOR DEVEDOR / A PAGAR</option>
          <option value="paid" ${exp.status==='paid'?'selected':''}>PAGO</option>
        </select>
      </div>
      <div class="flex justify-end pt-3">
        <button type="submit" class="btn-primary px-4 py-2 text-xs font-semibold rounded">Salvar Alterações</button>
      </div>
    </form>
  `;

  document.getElementById('edit-exp-form').addEventListener('submit', (e) => {
    e.preventDefault();
    exp.description = document.getElementById('edit-desc').value;
    exp.amount = parseFloat(document.getElementById('edit-amount').value);
    exp.due_date = document.getElementById('edit-date').value;
    exp.status = document.getElementById('edit-status').value;
    saveState();
    modal.classList.add('hidden');
    renderView();
  });

  modal.classList.remove('hidden');
};

/* =========================================================
   MÓDULO: CARTÕES DE CRÉDITO (COM EDIÇÃO DE LIMITES)
   ========================================================= */
function renderCardsView(root){
  root.innerHTML = `
    <div class="mb-6 flex justify-between items-center">
      <div>
        <p class="font-mono text-xs tracking-widest" style="color:var(--brass);">GESTÃO DE CRÉDITO</p>
        <h2 class="font-display text-3xl">Cartões de Crédito Cadastrados</h2>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
      ${state.creditCards.map(card => {
        const compromissos = state.expenses
          .filter(e => e.method === `card-${card.id}` && e.status !== 'paid')
          .reduce((s,e) => s + Number(e.amount||0), 0);
        const disponivel = card.total_limit - compromissos;

        return `
          <div class="paper-card p-6">
            <div class="flex justify-between items-start mb-4">
              <div>
                <h3 class="font-display text-xl">${card.name}</h3>
                <p class="text-xs font-mono text-gray-500">Fecha dia ${card.closing_day} · Vence dia ${card.due_day}</p>
              </div>
              <button onclick="editCard('${card.id}')" class="text-xs font-mono border px-2 py-1 rounded hover:bg-amber-100">Editar Limite / Dados</button>
            </div>
            
            <div class="space-y-2 text-sm font-mono">
              <div class="flex justify-between"><span>Limite Total:</span> <span>${formatBRL(card.total_limit)}</span></div>
              <div class="flex justify-between text-rose-700"><span>Comprometido (A Pagar):</span> <span>${formatBRL(compromissos)}</span></div>
              <div class="flex justify-between text-emerald-700 font-bold border-t pt-2"><span>Limite Disponível:</span> <span>${formatBRL(disponivel)}</span></div>
            </div>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

window.editCard = function(id){
  const card = state.creditCards.find(c => c.id === id);
  if(!card) return;

  const modal = document.getElementById('edit-modal');
  const content = document.getElementById('modal-content');

  content.innerHTML = `
    <h3 class="font-display text-xl mb-4">Editar Cartão: ${card.name}</h3>
    <form id="edit-card-form" class="space-y-3">
      <div>
        <label class="block text-xs font-mono">Nome do Cartão</label>
        <input type="text" id="card-edit-name" value="${card.name}" class="w-full p-2 text-sm rounded border">
      </div>
      <div>
        <label class="block text-xs font-mono">Limite Total (R$)</label>
        <input type="number" id="card-edit-limit" step="0.01" value="${card.total_limit}" class="w-full p-2 text-sm font-mono rounded border">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-mono">Dia Fechamento</label>
          <input type="number" id="card-edit-closing" min="1" max="31" value="${card.closing_day}" class="w-full p-2 text-sm font-mono rounded border">
        </div>
        <div>
          <label class="block text-xs font-mono">Dia Vencimento</label>
          <input type="number" id="card-edit-due" min="1" max="31" value="${card.due_day}" class="w-full p-2 text-sm font-mono rounded border">
        </div>
      </div>
      <div class="flex justify-end pt-3">
        <button type="submit" class="btn-primary px-4 py-2 text-xs font-semibold rounded">Salvar Alterações</button>
      </div>
    </form>
  `;

  document.getElementById('edit-card-form').addEventListener('submit', (e) => {
    e.preventDefault();
    card.name = document.getElementById('card-edit-name').value;
    card.total_limit = parseFloat(document.getElementById('card-edit-limit').value);
    card.closing_day = parseInt(document.getElementById('card-edit-closing').value);
    card.due_day = parseInt(document.getElementById('card-edit-due').value);
    saveState();
    modal.classList.add('hidden');
    renderView();
  });

  modal.classList.remove('hidden');
};

/* =========================================================
   MÓDULO: SALDOS E CONTAS
   ========================================================= */
function renderAccountsView(root){
  root.innerHTML = `
    <div class="mb-6">
      <p class="font-mono text-xs tracking-widest" style="color:var(--brass);">DISPONIBILIDADE REAL</p>
      <h2 class="font-display text-3xl">Contas e Saldos Disponíveis</h2>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      ${state.accounts.map(acc => `
        <div class="paper-card p-6">
          <p class="text-xs font-mono text-gray-500 uppercase">${acc.type}</p>
          <h3 class="font-display text-lg mt-1">${acc.name}</h3>
          <p class="font-mono text-2xl font-semibold mt-3" style="color:var(--sage);">${formatBRL(acc.balance)}</p>
          <button onclick="editAccount('${acc.id}')" class="mt-4 text-xs font-mono border px-2 py-1 rounded hover:bg-amber-100">Ajustar Saldo</button>
        </div>
      `).join('')}
    </div>
  `;
}

window.editAccount = function(id){
  const acc = state.accounts.find(a => a.id === id);
  if(!acc) return;

  const modal = document.getElementById('edit-modal');
  const content = document.getElementById('modal-content');

  content.innerHTML = `
    <h3 class="font-display text-xl mb-4">Ajustar Saldo: ${acc.name}</h3>
    <form id="edit-acc-form" class="space-y-3">
      <div>
        <label class="block text-xs font-mono">Saldo Efetivo Atual (R$)</label>
        <input type="number" id="acc-edit-balance" step="0.01" value="${acc.balance}" class="w-full p-2 text-sm font-mono rounded border">
      </div>
      <div class="flex justify-end pt-3">
        <button type="submit" class="btn-primary px-4 py-2 text-xs font-semibold rounded">Atualizar Saldo</button>
      </div>
    </form>
  `;

  document.getElementById('edit-acc-form').addEventListener('submit', (e) => {
    e.preventDefault();
    acc.balance = parseFloat(document.getElementById('acc-edit-balance').value);
    saveState();
    modal.classList.add('hidden');
    renderView();
  });

  modal.classList.remove('hidden');
};

/* =========================================================
   MÓDULO: CATEGORIAS & SUBCATEGORIAS
   ========================================================= */
function renderCategoriesView(root){
  root.innerHTML = `
    <div class="mb-6">
      <p class="font-mono text-xs tracking-widest" style="color:var(--brass);">ORGANIZAÇÃO</p>
      <h2 class="font-display text-3xl">Categorias e Subcategorias</h2>
    </div>

    <div class="paper-card p-6 mb-8">
      <h3 class="font-display text-lg mb-4">Adicionar Nova Categoria</h3>
      <form id="cat-form" class="flex gap-3">
        <input type="text" id="cat-name" required placeholder="Ex: Educação, Lazer..." class="p-2 text-sm rounded border flex-1">
        <button type="submit" class="btn-primary px-4 py-2 text-xs font-semibold rounded">Adicionar</button>
      </form>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      ${state.categories.map(cat => `
        <div class="paper-card p-5">
          <div class="flex justify-between items-center border-b pb-2 mb-3">
            <h4 class="font-display font-semibold text-lg">${cat.name}</h4>
          </div>
          <ul class="space-y-1 text-sm font-mono text-gray-600">
            ${cat.subcategories.map(sub => `<li>• ${sub.name}</li>`).join('')}
          </ul>
        </div>
      `).join('')}
    </div>
  `;

  document.getElementById('cat-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('cat-name').value;
    state.categories.push({ id: uuid(), name, subcategories: [] });
    saveState();
    renderView();
  });
}

/* Modal Close Listener */
document.getElementById('close-modal').addEventListener('click', () => {
  document.getElementById('edit-modal').classList.add('hidden');
});

/* Inicialização */
renderNav();
renderView();
</script>
</body>
</html>
